    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: #fff;
    font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
    position: relative;
    min-height: 100%;
  }
  .card {
    background: rgba(20,10,10,0.45);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    padding: 36px 28px;
    width: 100%;
    max-width: 380px;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  h1 { font-size: 1.5rem; margin: 0 0 6px; }
  .sub { color: rgba(255,255,255,0.8); font-size: 0.95rem; margin: 0 0 28px; }
  .play {
    width: 84px; height: 84px;
    border-radius: 50%;
    border: none;
    background: #fff;
    color: #7c3aed;
    cursor: pointer;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .play:hover { background: #f5f3ff; }
  .play.playing::before, .play.playing::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.6);
    animation: ring 2s ease-out infinite; pointer-events: none;
  }
  .play.playing::after { animation-delay: 1s; }
  @keyframes ring {
    from { transform: scale(1); opacity: 0.8; }
    to { transform: scale(1.6); opacity: 0; }
  }
  .play:active { transform: scale(0.96); }
  .play:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .play svg { width: 36px; height: 36px; fill: currentColor; }
  .progress {
    margin-top: 28px;
    height: 6px;
    background: rgba(255,255,255,0.3);
    border-radius: 3px;
    overflow: hidden;
    cursor: pointer;
  }
  .bar { height: 100%; width: 0%; background: #fff; transition: width 0.1s linear; }
  .times {
    display: flex;
    justify-content: space-between;
    direction: ltr;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.85);
    margin-top: 8px;
    font-variant-numeric: tabular-nums;
  }
  .error { color: #dc2626; font-size: 0.9rem; margin-top: 16px; display: none; }
</style>
</head>
<body>

    <button id="playBtn" class="play" aria-label="تشغيل">
      <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>

    <div class="progress" id="progress" role="slider" aria-label="شريط التقدم" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
      <div class="bar" id="bar"></div>
    </div>
    <div class="times">
      <span id="cur">0:00</span>
      <span id="dur">0:00</span>
    </div>

    <p class="error" id="err">تعذّر تشغيل الصوت في هذا المتصفح.</p>
  </main>

<script>
(function () {
  const audio = document.getElementById('audio');
  const btn = document.getElementById('playBtn');
  const iconPlay = document.getElementById('iconPlay');
  const iconPause = document.getElementById('iconPause');
  const bar = document.getElementById('bar');
  const progress = document.getElementById('progress');
  const cur = document.getElementById('cur');
  const dur = document.getElementById('dur');
  const err = document.getElementById('err');

  function fmt(s) {
    if (!isFinite(s)) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60).toString().padStart(2, '0');
    return m + ':' + sec;
  }

  function setPlaying(p) {
    iconPlay.style.display = p ? 'none' : 'block';
    iconPause.style.display = p ? 'block' : 'none';
    btn.setAttribute('aria-label', p ? 'إيقاف مؤقت' : 'تشغيل');
    btn.classList.toggle('playing', p);
  }

  btn.addEventListener('click', function () {
    if (audio.paused) {
      const p = audio.play();
      if (p && p.catch) p.catch(function () { err.style.display = 'block'; });
    } else {
      audio.pause();
    }
  });

  audio.addEventListener('play', function () { setPlaying(true); });
  audio.addEventListener('pause', function () { setPlaying(false); });
  audio.addEventListener('ended', function () { setPlaying(false); bar.style.width = '0%'; });
  audio.addEventListener('loadedmetadata', function () { dur.textContent = fmt(audio.duration); });
  audio.addEventListener('timeupdate', function () {
    const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    bar.style.width = pct + '%';
    progress.setAttribute('aria-valuenow', Math.round(pct));
    cur.textContent = fmt(audio.currentTime);
  });
  audio.addEventListener('error', function () { err.style.display = 'block'; });

  function seek(e) {
    if (!audio.duration) return;
    const rect = progress.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    audio.currentTime = Math.min(Math.max(x, 0), 1) * audio.duration;
  }
  progress.addEventListener('click', seek);
  progress.addEventListener('keydown', function (e) {
    if (!audio.duration) return;
    if (e.key === 'ArrowRight') audio.currentTime = Math.min(audio.currentTime + 5, audio.duration);
    if (e.key === 'ArrowLeft') audio.currentTime = Math.max(audio.currentTime - 5, 0);
  });
})();
</script>
